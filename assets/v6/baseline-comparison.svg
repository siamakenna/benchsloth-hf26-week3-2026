<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="630" viewBox="0 0 1140 630"><rect width="100%" height="100%" fill="#F8F6F0"/><text x="45" y="55" fill="#17352E" font-family="monospace" font-size="16">THE SEMANTIC TEST / 24 SYNTHETIC QUESTIONS</text><text x="45" y="110" fill="#17352E" font-family="Georgia" font-size="39">Read the failures with the result.</text><text x="45" y="180" fill="#17352E" font-family="Georgia" font-size="22">Strong rules + retrieval</text><rect x="380" y="155" width="620" height="35" rx="3" fill="#E6EADD" stroke="#BDCAB7"/><rect x="380" y="155" width="361.6666666666667" height="35" rx="3" fill="#658674" stroke="#BDCAB7"/><text x="1025" y="181" fill="#17352E" font-family="Georgia" font-size="23">14/24</text><text x="45" y="285" fill="#17352E" font-family="Georgia" font-size="22">Raw Gemma selection</text><rect x="380" y="260" width="620" height="35" rx="3" fill="#E6EADD" stroke="#BDCAB7"/><rect x="380" y="260" width="335.8333333333333" height="35" rx="3" fill="#658674" stroke="#BDCAB7"/><text x="1025" y="286" fill="#17352E" font-family="Georgia" font-size="23">13/24</text><text x="45" y="390" fill="#17352E" font-family="Georgia" font-size="22">Combined read-only agent</text><rect x="380" y="365" width="620" height="35" rx="3" fill="#E6EADD" stroke="#BDCAB7"/><rect x="380" y="365" width="387.5" height="35" rx="3" fill="#658674" stroke="#BDCAB7"/><text x="1025" y="391" fill="#17352E" font-family="Georgia" font-size="23">15/24</text><text x="45" y="519" fill="#17352E" font-family="Georgia" font-size="16">Exact answer status + exact source IDs; extra evidence counts against every method.</text><text x="45" y="553" fill="#17352E" font-family="Georgia" font-size="16">Assistant-authored, implementer-visible references. Independent human n=0.</text><text x="45" y="586" fill="#17352E" font-family="Georgia" font-size="16">Question answering is read only; historical timer results are reported separately.</text></svg>