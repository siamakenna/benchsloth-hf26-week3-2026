<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="672" viewBox="0 0 1600 672"><rect width="100%" height="100%" fill="#F8F6F0"/><text x="65" y="68" fill="#17352E" font-family="monospace" font-size="16">BENCHSLOTH / THE ATTENTION AGENT</text><text x="65" y="165" fill="#17352E" font-family="Georgia" font-size="73">Give your attention</text><text x="65" y="245" fill="#658674" font-family="Georgia" font-size="83">a plan.</text><text x="65" y="326" fill="#17352E" font-family="Georgia" font-size="28">I stopped asking AI to do what</text><text x="65" y="367" fill="#17352E" font-family="Georgia" font-size="28">simple rules did better.</text><text x="65" y="430" fill="#17352E" font-family="Georgia" font-size="21">Original evidence. Visible uncertainty.</text><text x="65" y="466" fill="#17352E" font-family="Georgia" font-size="21">A clear handoff when you return.</text><text x="65" y="597" fill="#17352E" font-family="monospace" font-size="15">LOCAL GEMMA · HUMAN REVIEW · SLOW &amp; STEADY</text><rect x="830" y="89" width="690" height="500" rx="3" fill="#EFF2E8" stroke="#BDCAB7"/><text x="860" y="135" fill="#17352E" font-family="monospace" font-size="16">THE ATTENTION MAP</text><text x="860" y="178" fill="#17352E" font-family="Georgia" font-size="18">01 / Original source</text><text x="860" y="217" fill="#17352E" font-family="Georgia" font-size="30">Wait 7 minutes.</text><text x="1390" y="217" fill="#17352E" font-family="Georgia" font-size="32">7 min</text><path d="M870 245V346" stroke="#658674" stroke-width="2"/><circle cx="870" cy="264" r="7" fill="#17352E"/><circle cx="870" cy="345" r="7" fill="#F8F6F0" stroke="#658674"/><text x="897" y="270" fill="#17352E" font-family="Georgia" font-size="22">02 / After that wait, record the label.</text><rect x="855" y="375" width="640" height="155" rx="3" fill="#FFFEF9" stroke="#BDCAB7"/><text x="877" y="410" fill="#17352E" font-family="monospace" font-size="13">ASK BENCHSLOTH / EVIDENCE FIRST</text><text x="877" y="450" fill="#17352E" font-family="Georgia" font-size="21">Which earlier wait does source 2 refer to?</text><text x="877" y="488" fill="#17352E" font-family="Georgia" font-size="17">Source 1 + source 2 → inspect the relationship.</text><text x="860" y="565" fill="#17352E" font-family="monospace" font-size="12">RECORDED OUTPUT / INTERACTIVE BROWSER</text></svg>