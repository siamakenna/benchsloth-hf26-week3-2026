<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><rect width="100%" height="100%" fill="#F8F6F0"/><text x="45" y="58" fill="#17352E" font-family="monospace" font-size="18">ONE AGENT. TWO KINDS OF AUTHORITY.</text><text x="45" y="112" fill="#17352E" font-family="Georgia" font-size="36">Evidence explains. Source rules decide the clock.</text><rect x="45" y="175" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="65" y="212" fill="#17352E" font-family="monospace" font-size="15">READ</text><text x="65" y="256" fill="#17352E" font-family="Georgia" font-size="18">Original source IDs + hash</text><rect x="395" y="175" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="415" y="212" fill="#17352E" font-family="monospace" font-size="15">UNDERSTAND</text><text x="415" y="256" fill="#17352E" font-family="Georgia" font-size="18">Gemma evidence selection</text><rect x="745" y="175" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="765" y="212" fill="#17352E" font-family="monospace" font-size="15">VERIFY</text><text x="765" y="256" fill="#17352E" font-family="Georgia" font-size="18">Exact quotes + review</text><rect x="45" y="365" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="65" y="402" fill="#17352E" font-family="monospace" font-size="15">PLAN</text><text x="65" y="446" fill="#17352E" font-family="Georgia" font-size="18">Frozen source restrictions</text><rect x="395" y="365" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="415" y="402" fill="#17352E" font-family="monospace" font-size="15">REST</text><text x="415" y="446" fill="#17352E" font-family="Georgia" font-size="18">User-confirmed interval</text><rect x="745" y="365" width="300" height="125" rx="3" fill="#DDE9DE" stroke="#BDCAB7"/><text x="765" y="402" fill="#17352E" font-family="monospace" font-size="15">RETURN</text><text x="765" y="446" fill="#17352E" font-family="Georgia" font-size="18">Recorded facts + source order</text><path d="M345 238H386M695 238H736M895 300V340H195V356M345 428H386M695 428H736" stroke="#658674" stroke-width="2" fill="none"/><text x="45" y="549" fill="#17352E" font-family="Georgia" font-size="16">Read-only semantic answers cannot start timers, amend procedures or certify physical work.</text><text x="45" y="585" fill="#17352E" font-family="Georgia" font-size="16">A valid citation proves source identity. Semantic correctness still needs review.</text></svg>