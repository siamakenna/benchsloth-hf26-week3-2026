<!doctype html><html lang="en"><meta charset="utf-8"><title>Review follow-up</title><style>body{max-width:720px;margin:40px auto;font:17px/1.6 system-ui;padding:24px;background:#f8f6f0;color:#17352e}label{display:block;margin:20px 0}textarea{width:100%;height:80px}</style><h1>Association and correction follow-up</h1><p>Qualitative extension, not randomized trial timing. Use the three-scenario demo supplied by the owner. Inspect ScenarioB's ambiguity and ScenarioC's relationships, reject or correct one interpretation, then return to its source.</p><label>Anonymous code <input id="code"></label><label>Which source did each note refer to? Which remained unresolved?<textarea id="association"></textarea></label><label>Did you accept any incorrect relationship? Describe it, or say none.<textarea id="errors"></textarea></label><label>Which correction did you make, and what changed?<textarea id="correction"></textarea></label><label>Ease of use,1 difficult to5 easy <input id="ease" type="number" min="1" max="5"></label><button id="export">Export follow-up JSON</button><script>const started=Date.now();document.getElementById('export').onclick=()=>{const d={format:'BenchSloth/qualitative-followup-v5',elapsed_ms:Date.now()-started};for(const id of ['code','association','errors','correction','ease'])d[id]=document.getElementById(id).value;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='benchsloth-review-followup.json';a.click()};</script></html>
